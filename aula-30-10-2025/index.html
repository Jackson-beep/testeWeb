<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Aula JS8n  </title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3">
               <!--menu-->
            </div>
            <div class="col-md-9 p-5">
                <h1>Página com Javascript</h1>
                <section class="p-2 border">
                    <h2>Exibir data ao passar o mause no botão</h2>
                    <button class="btn btn-success"onmouseover="document.getElementById('datahora').innerHTML = Date()"onmouseout="document.getElementById('datahora').innerHTML = 'O kelvyn rebola e roda a bolsinha na Leste Oeste as dez da noite'">
                        passe o mause AQUI e veja a data e hora atual
                    </button>
                    <p id="datahora"></p>
                </section>
                <section class="mt-3 p-2 border bg-ligth">
                    <h2>Javascript carregado via tag script</h2>
                    <p id="p1">
                        A ação do botão abaixo foi programada na tag script ao fim do body.
                    </p>
                    <button class="btn btn-outline-primary" onclick="copiaparagrafo()" >
                        Clique aqui para replicar o parágrafo acima
                    </button>
                    <p id="p2" >
                        O texto vai aparecer aqui
                    </p>
                </section>
                <section class="mt-3 p-2 border">
                    <h2>Editando o src (ssource) de uma imagem com js</h2>
                    <div class="row">
                    <div class="col">
                        <h3>Verção dois botões</h3>
                        <button class="btn btn-success" onclick="ligar()">
                            Ligar
                        </button>
                        <img id="lamp" src="img/pic_bulboff.gif" alt="Lampada desligada">
                        <button class="btn btn-danger" onclick="desligar()">
                            Desligar
                        </button>
                    </div>
                    <div class="col">
                        <h3>Versão 1 botão On/Off</h3>
                        <button class=" btn btn-success" onclick="onOff()">
                            On/Off
                        </button>
                        <img id="lamp2" src="img/homer-simpson-gif-1547466477.avif" alt="Lampada desligada">
                    </div>
                </div>
                </section>
            </div>
        </div>
    </div>
</body>
<script>
    function copiaparagrafo(){
        let texto = document.getElementById('p1').innerHTML;
        console.log(texto);
        document.getElementById('p2').innerHTML = texto;
    }

</script>
<script src="meuscript.js"></script>
</html>
